name: Bug report
description: Something in the Linear panel doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Open the Linear panel
        2. ...
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The output of `linear --version`, and your Herdr version.
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Screenshots or the error the panel shows. Please leave out API keys, issue titles or anything else private from your workspace.
